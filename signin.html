<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>Sign In — FutureCost</title>
  <meta
    name="description"
    content="Sign in to your FutureCost account."
  />
  <meta name="theme-color" content="#050507" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      position: relative;
      z-index: 2;
    }

    .auth-page-card {
      width: 100%;
      max-width: 460px;
      padding: 32px 28px;
      border-radius: 24px;
      background: rgba(13, 14, 18, 0.9);
      border: 1px solid rgba(201, 168, 97, 0.14);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(14px);
    }

    .auth-page-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .auth-page-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .auth-page-brand .brand-kicker {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #e4ca92 0%, #af8040 100%);
      color: #130f09;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .auth-page-brand .brand-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.03em;
    }

    .auth-page-back {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .auth-page-back:hover {
      color: var(--text);
    }

    .auth-page h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      letter-spacing: -0.04em;
    }

    .auth-page-sub {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.6;
    }

    .auth-page-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-page-form input {
      height: 50px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      background: #111;
      padding: 0 14px;
      color: #fff;
      font: inherit;
    }

    .auth-page-note {
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .auth-page-note a {
      color: var(--accent);
      text-decoration: none;
    }

    .auth-page-note a:hover {
      color: var(--accent-hover);
    }

    .auth-status {
      min-height: 22px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="app-bg" aria-hidden="true">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <main class="auth-page">
    <section class="auth-page-card">
      <div class="auth-page-top">
        <a href="/" class="auth-page-brand" aria-label="Go to FutureCost home">
          <span class="brand-kicker">FC</span>
          <span class="brand-name">FutureCost</span>
        </a>

        <a class="auth-page-back" href="/">Back to site</a>
      </div>

      <h1>Sign in</h1>
      <p class="auth-page-sub">
        Access your FutureCost account and continue tracking your decisions.
      </p>

      <form class="auth-page-form" id="signinForm">
        <input
          id="signinEmail"
          name="email"
          type="email"
          placeholder="Email Address"
          required
        />
        <input
          id="signinPassword"
          name="password"
          type="password"
          placeholder="Password"
          required
        />

        <button class="action-btn primary" type="submit">Sign In</button>
      </form>

      <div class="auth-status" id="signinStatus"></div>

      <p class="auth-page-note">
        Don’t have an account?
        <a href="/">Create one from the Get Started button</a>
      </p>
    </section>
  </main>

  <script>
    const signinForm = document.getElementById("signinForm");
    const signinStatus = document.getElementById("signinStatus");

    signinForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("signinEmail")?.value.trim();
      const password = document.getElementById("signinPassword")?.value;

      if (!email || !password) {
        signinStatus.textContent = "Please enter your email and password.";
        return;
      }

      try {
        console.log("Sign in attempt:", { email });
        signinStatus.textContent = "Sign-in UI works. Connect your real auth provider next.";
      } catch (error) {
        console.error("Sign in failed:", error);
        signinStatus.textContent = "Something went wrong while signing in.";
      }
    });
  </script>
</body>
</html>
